<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Laura & Johnson - 6 Meses</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="estilos.css"/>
</head>
<body>
<div class="page">

  <!-- TULIP -->
  <div class="tulip-wrap">
    <svg class="tulip-svg" width="90" height="160" viewBox="0 0 90 160" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M45 155 C45 120 45 105 45 80" stroke="#a8c5a0" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M45 110 C30 100 18 88 22 72 C30 82 38 96 45 110Z" fill="#b8d4b0" opacity="0.85"/>
      <path d="M45 100 C60 90 72 78 68 62 C60 72 52 86 45 100Z" fill="#a8c5a0" opacity="0.8"/>
      <path d="M30 80 C22 60 24 38 32 24 C36 38 36 60 38 80Z" fill="#e8b4b4" opacity="0.6"/>
      <path d="M60 80 C68 60 66 38 58 24 C54 38 54 60 52 80Z" fill="#dda0a0" opacity="0.6"/>
      <path d="M38 82 C34 60 36 36 45 18 C54 36 56 60 52 82Z" fill="#d4878a"/>
      <path d="M39 80 C33 62 35 42 41 26 C43 44 42 62 42 80Z" fill="#c9898a" opacity="0.8"/>
      <path d="M51 80 C57 62 55 42 49 26 C47 44 48 62 48 80Z" fill="#bf7f82" opacity="0.8"/>
      <path d="M44 78 C43 62 44 46 45 30 C46 46 47 62 46 78Z" fill="#e8b4b4" opacity="0.4"/>
    </svg>
  </div>

  <!-- HEADER -->
  <p class="eyebrow">2 de noviembre, 2026</p>
  <h1 class="headline">Laura<br/>&amp; <em>Johnson</em></h1>
  <p class="subline">Seis meses juntos ♥</p>
  <div class="divider"></div>

  <!-- FOTO → enlace a la carta -->
  <a class="photo-link" href="Carta.html" title="Leer la carta">
    <div class="photo-wrap">
      <div class="photo-ring"></div>
      <img src="img/Principal.jpg" alt="Laura y Johnson">
      <div class="photo-placeholder">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#c9898a" stroke-width="1.2" stroke-linecap="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <span>nuestra foto</span>
      </div>
    </div>
    <p class="photo-hint">Desplaza →</p>
  </a>

  <!-- COUNTER -->
  <div class="counter-strip">
    <div class="counter-item">
      <span class="counter-num" id="cnt-months">6</span>
      <span class="counter-label">Meses</span>
    </div>
    <div class="counter-item">
      <span class="counter-num" id="cnt-days">—</span>
      <span class="counter-label">Días</span>
    </div>
    <div class="counter-item">
      <span class="counter-num" id="cnt-hours">—</span>
      <span class="counter-label">Horas</span>
    </div>
    <div class="counter-item">
      <span class="counter-num" id="cnt-mins">—</span>
      <span class="counter-label">Minutos</span>
    </div>
  </div>

  <!-- QUOTE -->
  <div class="quote-block">
    <span class="quote-mark">"</span>
    <p class="quote-text">«Amo como ama el amor. No conozco otra razón para amar que amarte».<br/> — Fernando Pessoa.</p>
    <p class="quote-author">De Johnson, para Laura</p>
  </div>


  <!-- FOOTER -->
  <div class="footer">
    <p class="footer-names">♥Laura · Johnson♥</p>
    <p class="footer-date">02 · 11 · 2025 &nbsp;—&nbsp; 02 · 05 · 2026</p>
  </div>

</div>

<script>
  (function () {
    const start = new Date('2025-10-02T00:00:00');

    function update() {
      const now        = new Date();
      const diff       = now - start;
      const totalMins  = Math.floor(diff / 60000);
      const totalHours = Math.floor(diff / 3600000);
      const totalDays  = Math.floor(diff / 86400000);
      const months     = Math.floor(totalDays / 30.4375);

      document.getElementById('cnt-months').textContent = months;
      document.getElementById('cnt-days').textContent   = totalDays.toLocaleString('es');
      document.getElementById('cnt-hours').textContent  = totalHours.toLocaleString('es');
      document.getElementById('cnt-mins').textContent   = totalMins.toLocaleString('es');
    }

    update();
    setInterval(update, 60000);
  })();
</script>
</body>
</html>
